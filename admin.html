<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boulé | Página Protegida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F1E36;
    --navy-2:#16294a;
    --teal:#00A896;
    --teal-dark:#00857a;
    --orange:#FF6B35;
    --bg:#eef1f5;
    --card:#ffffff;
    --line:#e1e5ec;
    --text:#1c2434;
    --muted:#6b7688;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  /* LOGIN */
  .login-screen{
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    font-family:'Montserrat', sans-serif;
    z-index:9999;
  }
  .login-card{
    background:var(--card); border-radius:16px; padding:48px 40px;
    box-shadow:0 10px 40px rgba(15,30,54,.3);
    width:100%; max-width:420px;
  }
  .login-card h1{
    font-size:24px; font-weight:800; color:var(--navy); margin-bottom:12px; text-align:center;
  }
  .login-card .hint{
    font-size:13px; color:var(--muted); text-align:center; margin-bottom:28px; line-height:1.5;
  }
  .form-group{
    margin-bottom:20px;
  }
  .form-group label{
    display:block; font-size:11px; font-weight:700; color:var(--text);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  .form-group input{
    width:100%; padding:12px 14px; border:1.4px solid var(--line);
    border-radius:10px; font-family:inherit; font-size:14px; color:var(--text);
  }
  .form-group input:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,168,150,.1);
  }
  .login-btn{
    width:100%; padding:14px; background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    color:#fff; border:none; border-radius:10px; font-family:inherit;
    font-weight:700; font-size:14px; cursor:pointer; margin-top:8px;
  }
  .login-btn:hover{ filter:brightness(1.08); }
  .error-msg{
    color:#c0392b; font-size:12px; margin-top:12px; padding:10px 12px;
    background:#fdeaea; border-radius:8px; display:none;
  }
  .error-msg.show{ display:block; }

  /* APP */
  body{ font-family:'Montserrat', sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
  .sidebar{ width:262px; min-width:262px; background:var(--navy); color:#cfd6e4; display:flex; flex-direction:column; padding:10px 0 24px; max-height:100vh; overflow-y:auto; }
  .sidebar::-webkit-scrollbar{ width:6px; }
  .sidebar::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.15); border-radius:4px; }
  .sidebar .brand{ display:flex; align-items:center; gap:10px; padding:16px 18px 20px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:6px; }
  .sidebar .brand .mark{ width:32px;height:32px;border-radius:8px; background:linear-gradient(135deg,var(--teal),var(--teal-dark)); display:flex;align-items:center;justify-content:center; font-weight:800;color:#fff;font-size:15px; flex-shrink:0; }
  .sidebar .brand .word{ font-size:13.5px;font-weight:700;letter-spacing:.03em;color:#fff;line-height:1.15; }
  .sidebar .brand .word span{display:block;font-size:9.5px;font-weight:500;color:#8b96ac;letter-spacing:.08em;margin-top:1px;}
  .navgroup-label{ font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:#5c6885; padding:14px 18px 6px; font-weight:600; }
  .navitem{ display:flex; align-items:center; gap:11px; padding:9px 18px; font-size:13px; font-weight:500; cursor:pointer; color:#c3cbdc; border-left:3px solid transparent; transition:background .12s; user-select:none; }
  .navitem:hover{ background:rgba(255,255,255,.05); }
  .navitem.active{ background:var(--teal); color:#fff; font-weight:600; border-left:3px solid var(--orange); }
  .navitem .ico{ width:18px;height:18px;flex-shrink:0; display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700; border:1.4px solid currentColor; border-radius:4px; opacity:.85; }
  .navitem.active .ico{ border-color:#fff; opacity:1; }
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{ background:var(--card); border-bottom:1px solid var(--line); padding:18px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; position:sticky; top:0; z-index:5; }
  .topbar .titleblock{ display:flex; align-items:center; gap:16px; }
  .topbar .logo-mark{ width:52px;height:52px;border-radius:12px; background:var(--navy); display:flex;align-items:center;justify-content:center; color:var(--teal); font-weight:800; font-size:18px; }
  .topbar h1{ font-size:19px; font-weight:800; color:var(--navy); letter-spacing:.01em; }
  .topbar h1 small{ display:block; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .btn-add{ background:var(--orange); color:#fff; border:none; font-family:inherit; font-weight:700; font-size:13px; padding:11px 20px; border-radius:8px; cursor:pointer; box-shadow:0 2px 6px rgba(255,107,53,.35); }
  .btn-add:hover{ filter:brightness(1.06); }
  .content{ padding:24px 32px 48px; flex:1; }
  .showall{ background:#fff; border:1.4px solid var(--line); border-radius:20px; font-family:inherit; font-size:12px; font-weight:600; color:var(--muted); padding:8px 16px; cursor:pointer; margin-bottom:16px; }
  .showall:hover{ border-color:var(--teal); color:var(--teal-dark); }
  .stats-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:24px; }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; cursor:pointer; transition:box-shadow .12s, transform .12s; }
  .stat-card:hover{ box-shadow:0 3px 10px rgba(15,30,54,.08); transform:translateY(-1px); }
  .stat-card.selected{ border-color:var(--teal); box-shadow:0 0 0 2px rgba(0,168,150,.18); }
  .stat-card .label{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:#3a4257; letter-spacing:.02em; margin-bottom:10px; text-transform:uppercase; }
  .stat-ico{ width:11px;height:11px; border-radius:2px; flex-shrink:0; display:inline-block; }
  .stat-ico.square{ border-radius:2px; }
  .stat-ico.check::after{ content:"✔"; font-size:12px; line-height:11px; }
  .stat-ico.star::after{ content:"★"; font-size:12px; line-height:11px; }
  .stat-ico.folder::after{ content:"🗂"; font-size:12px; line-height:11px; }
  .stat-card .count{ font-size:26px; font-weight:800; color:var(--navy); }
  .c-orange{ background:var(--orange); color:var(--orange); }
  .c-green{ background:#2e9e4f; color:#2e9e4f; }
  .c-gray{ background:#8a93a6; color:#8a93a6; }
  .c-navy{ background:var(--navy); color:var(--navy); }
  .c-teal{ background:var(--teal); color:var(--teal); }
  .c-red{ background:#d9483a; color:#d9483a; }
  @media (max-width:1200px){ .stats-grid{ grid-template-columns:repeat(3,1fr);} }
  @media (max-width:860px){ .stats-grid{ grid-template-columns:repeat(2,1fr);} }
  .tablewrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); background:#fff; box-shadow:0 1px 3px rgba(15,30,54,.05); }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:920px; }
  thead th{ background:var(--teal); color:#fff; text-align:left; padding:12px 16px; font-weight:700; font-size:11px; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; position:sticky; top:0; }
  tbody td{ padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--text); line-height:1.45; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#f7f9fc; }
  .rownum{ color:var(--muted); font-weight:600; }
  .estado-pill{ display:inline-block; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.02em; white-space:nowrap; }
  .section-label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:22px 0 10px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🔐 Acceso Restringido</h1>
    <p class="hint">Página protegida. Ingresá la contraseña para continuar.</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" autofocus>
      </div>
      <button type="submit" class="login-btn">Ingresar</button>
      <div id="errorMsg" class="error-msg">Contraseña incorrecta.</div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none; width:100%;">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">M+</div>
      <div class="word">BOULÉ<span>GOVTECH</span></div>
    </div>
    <!-- nav items added by JS -->
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="titleblock">
        <div class="logo-mark">M+</div>
        <h1 id="pageTitle">Bandeja de Casos<small id="pageSubtitle">Panel de Gestión Integral · Boulé</small></h1>
      </div>
      <button class="btn-add" id="addBtn">+ Agregar</button>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<script>
// ========== CONFIG ==========
const ADMIN_PASSWORD = "admin123";
const SESSION_KEY = "admin_authenticated";

// ========== DATA ==========
function stat(label,count,color,ico){ return {label,count,color,ico}; }
function row(cells){ return cells; }

const AREAS = {
  bandeja: {
    group:"General", label:"Bandeja de Casos", icon:"B", type:"dashboard",
    title:"Bandeja de Casos", subtitle:"Vista consolidada · todas las áreas",
    stats:[
      stat("NUEVO",23,"c-orange","square"),
      stat("EN GESTIÓN",41,"c-green","square"),
      stat("EN CAMPO / TALLER",18,"c-gray","square"),
      stat("VALIDADO",9,"c-navy","check"),
      stat("ALERTA ACTIVA",3,"c-red","square"),
      stat("COMPLETADO",96,"c-teal","star"),
      stat("ARCHIVADO",267,"c-navy","folder"),
    ],
    columns:["Nº","Estado","Área","Código","Fecha","Hora","Descripción","Procedencia","Responsable"],
    rows:[
      row(["1","NUEVO","Comunitario","RC-0231","11/8/2026","19:05","Reclamo por ruido y polvo en suspensión durante horario nocturno.","Rama Caída","Junta Vecinal Rama Caída"]),
      row(["2","EN PROCESO","Mantenimiento","OT-1042","11/8/2026","10:28","Orden preventiva por alerta de horas de motor, MacLean 04.","Nivel -180","Taller Flota Subterránea"]),
      row(["3","ALERTA","Ambiental","AM-0088","10/8/2026","09:41","Lectura fuera de rango en piezómetro P-12, dique de relaves.","Depósito Norte","Monitoreo Relaves"]),
      row(["4","CERRADO","Trazabilidad","LT-0248","10/8/2026","08:15","Despacho de lote hacia puerto, análisis de leyes conforme.","Concentradora","Control de Calidad"]),
      row(["5","ALERTA","Seguridad","SG-0019","10/8/2026","06:52","Concentración de metano sobre umbral en galería.","Nivel -240","Jefe de Guardia"]),
    ]
  },
  buscador: { group:"General", label:"Buscador", icon:"Q", type:"simple", title:"Buscador", subtitle:"Búsqueda global de casos", msg:"Buscá cualquier caso por código, responsable, área o palabra clave en la descripción, en todos los módulos a la vez." },
  reportes: { group:"General", label:"Reportes", icon:"R", type:"simple", title:"Reportes", subtitle:"Indicadores y exportables", msg:"Generá reportes por área, período o responsable, listos para exportar en PDF o Excel." },
  crear: { group:"General", label:"Crear Caso", icon:"C", type:"simple", title:"Crear Caso", subtitle:"Nuevo registro", msg:"Elegí el área correspondiente en el menú lateral y usá "+ Agregar" para cargar un caso nuevo." },
};

// ========== LOGIN ==========
function initLogin(){
  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    if(pwd === ADMIN_PASSWORD){
      sessionStorage.setItem(SESSION_KEY, 'true');
      showApp();
    } else {
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('password').value = '';
      setTimeout(()=>document.getElementById('errorMsg').classList.remove('show'), 3000);
    }
  });
}

function checkSession(){
  return sessionStorage.getItem(SESSION_KEY) === 'true';
}

// ========== APP ==========
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  renderSidebar();
  selectArea('bandeja');
}

function hideApp(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('password').focus();
}

function renderSidebar(){
  const sidebarEl = document.getElementById('sidebar');
  let currentGroup = null;
  Object.entries(AREAS).forEach(([id,a])=>{
    if(a.group !== currentGroup){
      currentGroup = a.group;
      const lbl = document.createElement('div');
      lbl.className='navgroup-label';
      lbl.textContent=currentGroup;
      sidebarEl.appendChild(lbl);
    }
    const item = document.createElement('div');
    item.className='navitem';
    item.dataset.id=id;
    item.innerHTML = `<span class="ico">${a.icon}</span> ${a.label}`;
    item.addEventListener('click', ()=>selectArea(id));
    sidebarEl.appendChild(item);
  });
}

function selectArea(id){
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  const a = AREAS[id];
  document.getElementById('pageTitle').innerHTML = `${a.title}<small id="pageSubtitle">${a.subtitle}</small>`;
  document.getElementById('addBtn').textContent = a.type==='dashboard' ? '+ Agregar Caso' : '+ Agregar';

  const content = document.getElementById('content');
  if(a.type==='simple'){
    content.innerHTML = `<div style="background:var(--card); border:1px solid var(--line); border-radius:10px; padding:48px 32px; text-align:center; color:var(--muted); font-size:13.5px;"><div style="width:52px;height:52px;border-radius:12px;background:#eef6f5;color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin:0 auto 14px;">${a.icon}</div><h3 style="color:var(--navy); font-size:15px; margin-bottom:6px;">${a.title}</h3><p>${a.msg}</p></div>`;
    return;
  }

  let statsHtml = `<button class="showall" id="showAllBtn">mostrar todo</button><div class="stats-grid">`;
  a.stats.forEach((s,i)=>{
    statsHtml += `<div class="stat-card" data-idx="${i}"><div class="label"><span class="stat-ico ${s.color} ${s.ico}"></span>${s.label}</div><div class="count">${s.count}</div></div>`;
  });
  statsHtml += `</div>`;

  let tableHtml = `<div class="section-label">Historial · ${a.title}</div><div class="tablewrap"><table><thead><tr>`;
  a.columns.forEach(c=> tableHtml += `<th>${c}</th>`);
  tableHtml += `</tr></thead><tbody>`;
  a.rows.forEach(r=>{
    tableHtml += `<tr>`;
    r.forEach((cell,ci)=>{
      if(ci===0){ tableHtml += `<td class="rownum">${cell}</td>`; }
      else if(ci===1){ tableHtml += `<td>${estadoPill(cell)}</td>`; }
      else { tableHtml += `<td>${cell}</td>`; }
    });
    tableHtml += `</tr>`;
  });
  tableHtml += `</tbody></table></div>`;

  content.innerHTML = statsHtml + tableHtml;

  document.querySelectorAll('.stat-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const already = card.classList.contains('selected');
      document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('selected'));
      if(!already) card.classList.add('selected');
    });
  });
  document.getElementById('showAllBtn').addEventListener('click', ()=>{
    document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('selected'));
  });
}

function estadoPill(estado){
  const map = {
    "NUEVO":"#fff2e6;color:#c8631a",
    "EN GESTIÓN":"#eaf7ec;color:#237a3d",
    "EN PROCESO":"#eaf7ec;color:#237a3d",
    "PROGRAMADO":"#eaf7ec;color:#237a3d",
    "EN CÁLCULO":"#eaf7ec;color:#237a3d",
    "EN MONITOREO":"#eaf7ec;color:#237a3d",
    "EN PROCESO PLANTA":"#eaf7ec;color:#237a3d",
    "EVALUANDO":"#eaf7ec;color:#237a3d",
    "EN EJECUCIÓN":"#eaf7ec;color:#237a3d",
    "RESPONDIDO":"#eef0f3;color:#6b7688",
    "EN TALLER":"#eef0f3;color:#6b7688",
    "EN INTERVENCIÓN":"#eef0f3;color:#6b7688",
    "EN REVISIÓN":"#eef0f3;color:#6b7688",
    "EN TRÁNSITO":"#eef0f3;color:#6b7688",
    "RIESGO MEDIO":"#eef0f3;color:#6b7688",
    "ESCALADO":"#fdeaea;color:#c0392b",
    "ALERTA":"#fdeaea;color:#c0392b",
    "ALERTA ACTIVA":"#fdeaea;color:#c0392b",
    "RIESGO ALTO":"#fdeaea;color:#c0392b",
    "EVACUACIÓN":"#fdeaea;color:#c0392b",
    "EN CAMPO":"#e7f0fb;color:#1c5fa8",
    "VALIDADO":"#e7f0fb;color:#1c5fa8",
    "EN CONDICIÓN":"#e7f0fb;color:#1c5fa8",
    "DESPACHADO":"#e7f0fb;color:#1c5fa8",
    "COMPLETADO":"#e7f6f4;color:#00857a",
    "CUMPLIDO":"#e7f6f4;color:#00857a",
    "AUDITADO":"#e7f6f4;color:#00857a",
    "ENTREGADO":"#e7f6f4;color:#00857a",
    "RESUELTO":"#e7f6f4;color:#00857a",
    "APTO":"#e7f6f4;color:#00857a",
    "CERRADO":"#eef0f3;color:#6b7688",
    "ARCHIVADO":"#eef0f3;color:#6b7688",
  };
  const style = map[estado] || "#eef0f3;color:#6b7688";
  const [bg,colorPart] = style.split(';color:');
  return `<span class="estado-pill" style="background:${bg};color:${colorPart}">${estado}</span>`;
}

// ========== INIT ==========
document.getElementById('appScreen').querySelector('.btn-add').addEventListener('click', function(){
  // Placeholder for add functionality
  alert('Funcionalidad de agregar en desarrollo');
});

initLogin();
if(checkSession()) showApp();
</script>
</body>
</html>
